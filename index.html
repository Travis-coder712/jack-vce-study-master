  'Cubics of form f(x) = (x − h)³ + k (6E)': 'cubicTP',
  'Sketching factorised cubics (6F)': 'cubicFactored',
  'The bisection method (6K)': 'bisection'
};

// ----- CANVAS PLOTTING PRIMITIVES -----
function plotSetup(canvasId, opts) {
  const c = document.getElementById(canvasId);
  if (!c) return null;
  const ctx = c.getContext('2d');
  const w = c.width, h = c.height;
  ctx.fillStyle = '#f8fafc'; // light bg, readable in dark/light themes
  ctx.fillRect(0, 0, w, h);
  return { ctx, w, h, xMin: opts.xMin, xMax: opts.xMax, yMin: opts.yMin, yMax: opts.yMax };
}
function toPx(p, x, y) {
  return [
    (x - p.xMin) / (p.xMax - p.xMin) * p.w,
    (p.yMax - y) / (p.yMax - p.yMin) * p.h
  ];
}
function drawAxes(p, opts = {}) {
  const { ctx } = p;
  // Gridlines
  ctx.strokeStyle = '#e2e8f0';
  ctx.lineWidth = 1;
  ctx.beginPath();
  for (let x = Math.ceil(p.xMin); x <= Math.floor(p.xMax); x++) {
    const [px] = toPx(p, x, 0);
    ctx.moveTo(px, 0); ctx.lineTo(px, p.h);
  }
  for (let y = Math.ceil(p.yMin); y <= Math.floor(p.yMax); y++) {
    const [, py] = toPx(p, 0, y);
    ctx.moveTo(0, py); ctx.lineTo(p.w, py);
  }
  ctx.stroke();
  // Axes
  ctx.strokeStyle = '#475569';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  const [x0] = toPx(p, 0, 0);
  const [, y0] = toPx(p, 0, 0);
  ctx.moveTo(0, y0); ctx.lineTo(p.w, y0);
  ctx.moveTo(x0, 0); ctx.lineTo(x0, p.h);
  ctx.stroke();
  // Tick labels
  ctx.fillStyle = '#64748b';
  ctx.font = '10px sans-serif';
  for (let x = Math.ceil(p.xMin); x <= Math.floor(p.xMax); x++) {
    if (x === 0) continue;
    const [px] = toPx(p, x, 0);
    ctx.fillText(x, px - 4, y0 + 12);
  }
  for (let y = Math.ceil(p.yMin); y <= Math.floor(p.yMax); y++) {
    if (y === 0) continue;
    const [, py] = toPx(p, 0, y);
    ctx.fillText(y, x0 + 4, py + 3);
  }
}
function drawCurve(p, f, color = '#6366f1', lineWidth = 2.5) {
  const { ctx } = p;
  ctx.strokeStyle = color;
  ctx.lineWidth = lineWidth;
  ctx.beginPath();
  let prev = null;
  const STEPS = 400;
  for (let i = 0; i <= STEPS; i++) {
    const x = p.xMin + (i / STEPS) * (p.xMax - p.xMin);
    let y;
    try { y = f(x); } catch(e) { y = NaN; }
    if (!isFinite(y) || Math.abs(y) > 1000) { prev = null; continue; }
    const [px, py] = toPx(p, x, y);
    if (prev === null) { ctx.moveTo(px, py); prev = [px, py]; }
    else {
      // Jump cut for asymptotes
      if (Math.abs(py - prev[1]) > p.h * 2) { ctx.moveTo(px, py); }
      else { ctx.lineTo(px, py); }
      prev = [px, py];
    }
  }
  ctx.stroke();
}
function drawPoint(p, x, y, color = '#f59e0b', label = '', filled = true) {
  const { ctx } = p;
  if (!isFinite(x) || !isFinite(y)) return;
  const [px, py] = toPx(p, x, y);
  ctx.fillStyle = filled ? color : '#f8fafc';
  ctx.strokeStyle = color;
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(px, py, 5, 0, Math.PI * 2);
  ctx.fill();
  ctx.stroke();
  if (label) {
    ctx.fillStyle = '#1e293b';
    ctx.font = 'bold 11px sans-serif';
    ctx.fillText(label, px + 8, py - 8);
  }
}
function drawAsymptote(p, type, value, color = '#dc2626') {
  const { ctx } = p;
  ctx.strokeStyle = color;
  ctx.lineWidth = 1.5;
  ctx.setLineDash([5, 4]);
  ctx.beginPath();
  if (type === 'v') {
    const [px] = toPx(p, value, 0);
    ctx.moveTo(px, 0); ctx.lineTo(px, p.h);
  } else {
    const [, py] = toPx(p, 0, value);
    ctx.moveTo(0, py); ctx.lineTo(p.w, py);
  }
  ctx.stroke();
  ctx.setLineDash([]);
}
function drawLine(p, m, c, color = '#94a3b8', dashed = true) {
  // y = mx + c, drawn over the viewport
  const { ctx } = p;
  ctx.strokeStyle = color;
  ctx.lineWidth = 1.5;
  if (dashed) ctx.setLineDash([4, 4]);
  const [x1, y1] = toPx(p, p.xMin, m * p.xMin + c);
  const [x2, y2] = toPx(p, p.xMax, m * p.xMax + c);
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
  if (dashed) ctx.setLineDash([]);
}

// ----- WIDGET HTML BUILDER -----
function widgetSlider(id, key, label, min, max, step, value) {
  return `<div style="display:flex;align-items:center;gap:0.4rem;font-size:0.78rem;">
    <span style="font-weight:700;min-width:18px;">${label}</span>
    <input type="range" min="${min}" max="${max}" step="${step}" value="${value}"
      oninput="onWidgetSlider('${id}', '${key}', this.value)" style="flex:1;">
    <span id="${id}-${key}-val" style="font-family:monospace;min-width:36px;text-align:right;">${value}</span>
  </div>`;
}

function renderWidget(id) {
  const s = widgetState[id];
  let html = `<div style="background:rgba(99,102,241,0.06);border:1px solid var(--border);border-radius:10px;padding:0.7rem;margin:0.6rem 0;">`;
  html += `<div style="font-weight:700;font-size:0.85rem;margin-bottom:0.4rem;color:#6366f1;">🎛️ Try it — drag the sliders</div>`;

  if (id === 'paraTP') {
    html += widgetSlider(id, 'a', 'a', -3, 3, 0.1, s.a);
    html += widgetSlider(id, 'h', 'h', -5, 5, 0.5, s.h);
    html += widgetSlider(id, 'k', 'k', -5, 5, 0.5, s.k);
  } else if (id === 'discriminant') {
    html += widgetSlider(id, 'a', 'a', -3, 3, 0.5, s.a);
    html += widgetSlider(id, 'b', 'b', -6, 6, 0.5, s.b);
    html += widgetSlider(id, 'c', 'c', -6, 6, 0.5, s.c);
  } else if (id === 'hyperbola' || id === 'truncus' || id === 'sqrt' || id === 'cubicTP') {
    html += widgetSlider(id, 'a', 'a', -3, 3, 0.1, s.a);
    html += widgetSlider(id, 'h', 'h', -5, 5, 0.5, s.h);
    html += widgetSlider(id, 'k', 'k', -5, 5, 0.5, s.k);
  } else if (id === 'circle') {
    html += widgetSlider(id, 'h', 'h', -5, 5, 0.5, s.h);
    html += widgetSlider(id, 'k', 'k', -5, 5, 0.5, s.k);
    html += widgetSlider(id, 'r', 'r', 0.5, 6, 0.5, s.r);
  } else if (id === 'cubicFactored') {
    html += widgetSlider(id, 'p', 'p', -5, 5, 0.5, s.p);
    html += widgetSlider(id, 'q', 'q', -5, 5, 0.5, s.q);
    html += widgetSlider(id, 'r', 'r', -5, 5, 0.5, s.r);
    html += widgetSlider(id, 'a', 'a', -2, 2, 0.1, s.a);
  } else if (id === 'inverse') {
    html += `<div style="font-size:0.78rem;display:flex;gap:0.3rem;flex-wrap:wrap;">`;
    const choices = ['f(x) = 2x − 3', 'f(x) = x²,  x ≥ 0', 'f(x) = x³', 'f(x) = (x − 2)² + 1,  x ≥ 2'];
    choices.forEach((label, i) => {
      const sel = s.choice === i;
      html += `<button onclick="onWidgetChoice('inverse', ${i})" style="padding:0.25rem 0.5rem;border-radius:6px;border:1px solid ${sel ? '#6366f1' : 'var(--border)'};background:${sel ? '#6366f1' : 'var(--surface)'};color:${sel ? 'white' : 'var(--text)'};font-size:0.75rem;cursor:pointer;">${label}</button>`;
    });
    html += `</div>`;
  } else if (id === 'piecewise') {
    html += widgetSlider(id, 'boundary', 'boundary', -3, 3, 0.5, s.boundary);
    html += `<div style="font-size:0.75rem;color:var(--text-muted);margin-top:0.3rem;">f(x) = 2x + 1 for x &lt; boundary;   3 − x² for x ≥ boundary</div>`;
  } else if (id === 'bisection') {
    html += `<div style="font-size:0.78rem;color:var(--text-muted);margin-bottom:0.3rem;">Find a root of  f(x) = x³ − x − 1  in [a, b]</div>`;
    html += `<div style="display:flex;gap:0.4rem;flex-wrap:wrap;">`;
    html += `<button class="btn btn-primary btn-sm" onclick="bisectionStep()" style="background:linear-gradient(135deg,#6366f1,#8b5cf6);">Step ▶</button>`;
    html += `<button class="btn btn-secondary btn-sm" onclick="bisectionReset()">Reset</button>`;
    html += `<div id="bisection-readout" style="font-family:monospace;font-size:0.75rem;color:var(--text-muted);align-self:center;flex:1;min-width:140px;">iteration 0</div>`;
    html += `</div>`;
  }

  html += `<canvas id="${id}-canvas" width="320" height="240" style="width:100%;max-width:340px;display:block;margin:0.5rem auto 0;background:#f8fafc;border-radius:8px;border:1px solid var(--border);"></canvas>`;
  html += `<div id="${id}-readout" style="font-size:0.78rem;text-align:center;margin-top:0.3rem;color:var(--text-muted);font-family:monospace;"></div>`;
  html += `</div>`;
  return html;
}

// ----- WIDGET DRAW DISPATCHER -----
function drawWidget(id) {
  const fn = WIDGET_DRAWERS[id];
  if (fn) fn();
}

// Each draw function reads widgetState[id] and re-draws its canvas + readout.
const WIDGET_DRAWERS = {
  paraTP() {
    const s = widgetState.paraTP;
    const p = plotSetup('paraTP-canvas', { xMin: -10, xMax: 10, yMin: -10, yMax: 10 });
    if (!p) return;
    drawAxes(p);
    drawCurve(p, x => s.a * (x - s.h) * (x - s.h) + s.k, '#6366f1', 3);
    drawPoint(p, s.h, s.k, '#f59e0b', `TP (${s.h}, ${s.k})`);
    drawAsymptote(p, 'v', s.h, '#94a3b8');
    const r = document.getElementById('paraTP-readout');
    if (r) r.innerHTML = `y = ${s.a}(x − ${s.h})² + ${s.k}<br>${s.a > 0 ? 'opens UP (minimum at TP)' : s.a < 0 ? 'opens DOWN (maximum at TP)' : 'a = 0 (not a parabola!)'}`;
  },
  discriminant() {
    const s = widgetState.discriminant;
    const p = plotSetup('discriminant-canvas', { xMin: -10, xMax: 10, yMin: -10, yMax: 15 });
    if (!p) return;
    drawAxes(p);
    drawCurve(p, x => s.a * x * x + s.b * x + s.c, '#6366f1', 3);
    const delta = s.b * s.b - 4 * s.a * s.c;
    let deltaColor, msg;
    if (delta > 0) {
      deltaColor = '#10b981';
      const x1 = (-s.b - Math.sqrt(delta)) / (2 * s.a);
      const x2 = (-s.b + Math.sqrt(delta)) / (2 * s.a);
      drawPoint(p, x1, 0, '#10b981', x1.toFixed(2));
      drawPoint(p, x2, 0, '#10b981', x2.toFixed(2));
      msg = `Δ = ${delta.toFixed(2)} > 0  →  two distinct real roots`;
    } else if (Math.abs(delta) < 0.001) {
      deltaColor = '#f59e0b';
      const x1 = -s.b / (2 * s.a);
      drawPoint(p, x1, 0, '#f59e0b', `x = ${x1.toFixed(2)}`);
      msg = `Δ ≈ 0  →  one repeated root`;
    } else {
      deltaColor = '#dc2626';
      msg = `Δ = ${delta.toFixed(2)} < 0  →  no real roots`;
    }
    const r = document.getElementById('discriminant-readout');
    if (r) r.innerHTML = `y = ${s.a}x² + ${s.b}x + ${s.c}<br><span style="color:${deltaColor};font-weight:700;">${msg}</span>`;
  },
  hyperbola() {
    const s = widgetState.hyperbola;
    const p = plotSetup('hyperbola-canvas', { xMin: -10, xMax: 10, yMin: -10, yMax: 10 });
    if (!p) return;
    drawAxes(p);
    drawAsymptote(p, 'v', s.h);
    drawAsymptote(p, 'h', s.k);
    drawCurve(p, x => Math.abs(x - s.h) < 0.01 ? NaN : s.a / (x - s.h) + s.k, '#6366f1', 3);
    const r = document.getElementById('hyperbola-readout');
    if (r) r.innerHTML = `y = ${s.a}/(x − ${s.h}) + ${s.k}<br>VA: x = ${s.h},  HA: y = ${s.k}`;
  },
  truncus() {
    const s = widgetState.truncus;
    const p = plotSetup('truncus-canvas', { xMin: -10, xMax: 10, yMin: -10, yMax: 10 });
    if (!p) return;
    drawAxes(p);
    drawAsymptote(p, 'v', s.h);
    drawAsymptote(p, 'h', s.k);
    drawCurve(p, x => Math.abs(x - s.h) < 0.01 ? NaN : s.a / ((x - s.h) * (x - s.h)) + s.k, '#6366f1', 3);
    const r = document.getElementById('truncus-readout');
    if (r) r.innerHTML = `y = ${s.a}/(x − ${s.h})² + ${s.k}<br>${s.a > 0 ? `Range: y > ${s.k}` : `Range: y < ${s.k}`}  (NOT all of ℝ!)`;
  },
  sqrt() {
    const s = widgetState.sqrt;
    const p = plotSetup('sqrt-canvas', { xMin: -10, xMax: 10, yMin: -10, yMax: 10 });
    if (!p) return;
    drawAxes(p);
    drawCurve(p, x => (x - s.h) < 0 ? NaN : s.a * Math.sqrt(x - s.h) + s.k, '#6366f1', 3);
    drawPoint(p, s.h, s.k, '#f59e0b', `endpoint (${s.h}, ${s.k})`);
    const r = document.getElementById('sqrt-readout');
    if (r) r.innerHTML = `y = ${s.a}√(x − ${s.h}) + ${s.k}<br>Domain: x ≥ ${s.h};  Range: y ${s.a > 0 ? '≥' : '≤'} ${s.k}`;
  },
  circle() {
    const s = widgetState.circle;
    const p = plotSetup('circle-canvas', { xMin: -10, xMax: 10, yMin: -10, yMax: 10 });
    if (!p) return;
    drawAxes(p);
    // Draw circle parametrically
    const { ctx } = p;
    ctx.strokeStyle = '#6366f1';
    ctx.lineWidth = 3;
    ctx.beginPath();
    for (let t = 0; t <= 2 * Math.PI + 0.01; t += 0.02) {
      const x = s.h + s.r * Math.cos(t);
      const y = s.k + s.r * Math.sin(t);
      const [px, py] = toPx(p, x, y);
      if (t === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.stroke();
    drawPoint(p, s.h, s.k, '#f59e0b', `centre (${s.h}, ${s.k})`);
    const r = document.getElementById('circle-readout');
    if (r) r.innerHTML = `(x − ${s.h})² + (y − ${s.k})² = ${(s.r * s.r).toFixed(1)}<br>centre (${s.h}, ${s.k}),  radius ${s.r},  area ${(Math.PI * s.r * s.r).toFixed(2)}`;
  },
  inverse() {
    const s = widgetState.inverse;
    const p = plotSetup('inverse-canvas', { xMin: -6, xMax: 6, yMin: -6, yMax: 6 });
    if (!p) return;
    drawAxes(p);
    drawLine(p, 1, 0, '#94a3b8', true); // y = x
    const funcs = [
      { f: x => 2 * x - 3, inv: y => (y + 3) / 2, dom: x => true,  label: 'f(x) = 2x − 3,  f⁻¹(x) = (x + 3)/2', pt: 2 },
      { f: x => x * x,     inv: y => y >= 0 ? Math.sqrt(y) : NaN, dom: x => x >= 0, label: 'f(x) = x²  (x ≥ 0),  f⁻¹(x) = √x', pt: 2 },
      { f: x => x * x * x, inv: y => Math.cbrt(y), dom: x => true, label: 'f(x) = x³,  f⁻¹(x) = ∛x', pt: 1.5 },
      { f: x => (x - 2) * (x - 2) + 1, inv: y => y >= 1 ? 2 + Math.sqrt(y - 1) : NaN, dom: x => x >= 2, label: 'f(x) = (x − 2)² + 1, x ≥ 2;  f⁻¹(x) = 2 + √(x − 1)', pt: 3 }
    ];
    const fc = funcs[s.choice];
    drawCurve(p, x => fc.dom(x) ? fc.f(x) : NaN, '#6366f1', 3);
    drawCurve(p, x => fc.inv(x), '#10b981', 3);
    // Demo point on f and its mirror on f⁻¹
    const x0 = fc.pt;
    const y0 = fc.f(x0);
    drawPoint(p, x0, y0, '#f59e0b', `(${x0}, ${y0.toFixed(1)})`);
    drawPoint(p, y0, x0, '#dc2626', `(${y0.toFixed(1)}, ${x0})`);
    const rd = document.getElementById('inverse-readout');
    if (rd) rd.innerHTML = `${fc.label}<br><span style="color:#6366f1;">— f(x)</span>  ·  <span style="color:#10b981;">— f⁻¹(x)</span>  ·  <span style="color:#94a3b8;">- - y = x</span>`;
  },
  piecewise() {
    const s = widgetState.piecewise;
    const p = plotSetup('piecewise-canvas', { xMin: -6, xMax: 6, yMin: -8, yMax: 8 });
    if (!p) return;
    drawAxes(p);
    const b = s.boundary;
    // First piece: 2x + 1 for x < b
    drawCurve(p, x => x < b ? 2 * x + 1 : NaN, '#6366f1', 3);
    // Second piece: 3 − x² for x ≥ b
    drawCurve(p, x => x >= b ? 3 - x * x : NaN, '#10b981', 3);
    // Boundary points: open circle on first piece, closed on second
    const y1 = 2 * b + 1, y2 = 3 - b * b;
    drawPoint(p, b, y1, '#6366f1', '', false);  // open
    drawPoint(p, b, y2, '#10b981', '', true);   // closed
    const r = document.getElementById('piecewise-readout');
    if (r) r.innerHTML = `f(${b}) = ${y2.toFixed(2)}  (uses second piece, x ≥ ${b})<br><span style="color:#6366f1;">— 2x+1</span>  ·  <span style="color:#10b981;">— 3 − x²</span>`;
  },
  cubicTP() {
    const s = widgetState.cubicTP;
    const p = plotSetup('cubicTP-canvas', { xMin: -6, xMax: 6, yMin: -10, yMax: 10 });
    if (!p) return;
    drawAxes(p);
    drawCurve(p, x => s.a * Math.pow(x - s.h, 3) + s.k, '#6366f1', 3);
    drawPoint(p, s.h, s.k, '#f59e0b', `SPI (${s.h}, ${s.k})`);
    const r = document.getElementById('cubicTP-readout');
    if (r) r.innerHTML = `y = ${s.a}(x − ${s.h})³ + ${s.k}<br>SPI at (${s.h}, ${s.k})  ·  one x-intercept only`;
  },
  cubicFactored() {
    const s = widgetState.cubicFactored;
    const p = plotSetup('cubicFactored-canvas', { xMin: -6, xMax: 6, yMin: -10, yMax: 10 });
    if (!p) return;
    drawAxes(p);
    const f = x => s.a * (x - s.p) * (x - s.q) * (x - s.r);
    drawCurve(p, f, '#6366f1', 3);
    drawPoint(p, s.p, 0, '#f59e0b', `${s.p}`);
    drawPoint(p, s.q, 0, '#f59e0b', `${s.q}`);
    drawPoint(p, s.r, 0, '#f59e0b', `${s.r}`);
    drawPoint(p, 0, f(0), '#dc2626', `y-int ${f(0).toFixed(1)}`);
    const rd = document.getElementById('cubicFactored-readout');
    if (rd) rd.innerHTML = `y = ${s.a}(x − ${s.p})(x − ${s.q})(x − ${s.r})<br>x-ints: ${s.p}, ${s.q}, ${s.r}  ·  y-int: ${f(0).toFixed(2)}`;
  },
  bisection() {
    const s = widgetState.bisection;
    const f = x => x * x * x - x - 1;
    const p = plotSetup('bisection-canvas', { xMin: -1, xMax: 3, yMin: -3, yMax: 5 });
    if (!p) return;
    drawAxes(p);
    drawCurve(p, f, '#6366f1', 3);
    drawPoint(p, s.a, f(s.a), '#dc2626', `a=${s.a.toFixed(3)}`);
    drawPoint(p, s.b, f(s.b), '#10b981', `b=${s.b.toFixed(3)}`);
    if (s.iter > 0) {
      const c = (s.a + s.b) / 2;
      drawPoint(p, c, 0, '#f59e0b', `c=${c.toFixed(3)}`);
      drawAsymptote(p, 'v', c, '#f59e0b');
    }
    const r = document.getElementById('bisection-readout');
    if (r) {
      const width = (s.b - s.a).toFixed(4);
      r.innerHTML = `iter ${s.iter}: a=${s.a.toFixed(4)}, b=${s.b.toFixed(4)}, width=${width}`;
    }
  }
};

function onWidgetSlider(id, key, value) {
  widgetState[id][key] = parseFloat(value);
  document.getElementById(`${id}-${key}-val`).textContent = value;
  drawWidget(id);
}
function onWidgetChoice(id, choice) {
  widgetState[id].choice = choice;
  render();
  setTimeout(() => initMethodsPrepWidgets(), 0);
}
function bisectionStep() {
  const s = widgetState.bisection;
  const f = x => x * x * x - x - 1;
  if (s.b - s.a < 0.001) return;
  const c = (s.a + s.b) / 2;
  if (f(c) * f(s.a) < 0) s.b = c; else s.a = c;
  s.iter++;
  drawWidget('bisection');
}
function bisectionReset() {
  widgetState.bisection = { a: 1, b: 2, iter: 0, history: [] };
  drawWidget('bisection');
}
function initMethodsPrepWidgets() {
  if (methodsPrepView !== 'chapters') return;
  const c = METHODS_CHAPTERS.find(x => x.num === methodsPrepActiveChapter);
  if (!c) return;
  const step = methodsPrepStepByChapter[methodsPrepActiveChapter] || 0;
  const concept = c.concepts[step];
  if (!concept) return;
  const widgetId = CONCEPT_WIDGETS[concept.name];
  if (widgetId) drawWidget(widgetId);
}

// State + handlers for the prep module
let methodsPrepView = 'overview';
let methodsPrepActiveChapter = 3;
let methodsPrepActiveCASChapter = 3;
let methodsPrepExpandedConcepts = {};
let methodsPrepExpandedExplainers = {};
let methodsPrepExpandedCAS = {};
let methodsPrepStepByChapter = { 3: 0, 4: 0, 5: 0, 6: 0 };
let methodsPrepChaptersMode = 'walkthrough'; // 'walkthrough' or 'list'
let questionTypesChapter = 3;
let questionTypesExpanded = {};
function setQuestionTypesChapter(n) { questionTypesChapter = n; render(); }
function toggleQuestionType(id) { questionTypesExpanded[id] = !questionTypesExpanded[id]; render(); }
function expandAllQuestionTypes() {
  EXAM_QUESTION_TYPES.filter(q => q.ch === questionTypesChapter).forEach(q => questionTypesExpanded[q.id] = true);
  render();
}
function collapseAllQuestionTypes() {
  EXAM_QUESTION_TYPES.filter(q => q.ch === questionTypesChapter).forEach(q => questionTypesExpanded[q.id] = false);
  render();
}
let diagState = { current: 0, answered: false, selected: null, answers: [], started: false };

function setMethodsPrepView(v) {
  methodsPrepView = v;
  render();
  try { window.scrollTo({ top: 0, behavior: 'smooth' }); } catch(e) {}
}

function setMethodsChapter(num) {
  methodsPrepActiveChapter = num;
  render();
  setTimeout(initMethodsPrepWidgets, 0);
}
function setMethodsStep(idx) {
  const c = METHODS_CHAPTERS.find(x => x.num === methodsPrepActiveChapter);
  if (!c) return;
  if (idx < 0) idx = 0;
  if (idx >= c.concepts.length) idx = c.concepts.length - 1;
  methodsPrepStepByChapter[methodsPrepActiveChapter] = idx;
  render();
  setTimeout(initMethodsPrepWidgets, 0);
}
function setMethodsChaptersMode(m) {
  methodsPrepChaptersMode = m;
  render();
  setTimeout(initMethodsPrepWidgets, 0);
}

function setMethodsCASChapter(num) {
  methodsPrepActiveCASChapter = num;
  render();
}

function toggleMethodsConcept(key) {
  methodsPrepExpandedConcepts[key] = !methodsPrepExpandedConcepts[key];
  render();
}

function toggleMethodsExplainer(key) {
  methodsPrepExpandedExplainers[key] = !methodsPrepExpandedExplainers[key];
  render();
}

function toggleMethodsCAS(key) {
  methodsPrepExpandedCAS[key] = !methodsPrepExpandedCAS[key];
  render();
}

function startDiagnostic() {
  diagState = { current: 0, answered: false, selected: null, answers: [], started: true };
  render();
}

function answerDiagnostic(idx) {
  if (diagState.answered) return;
  diagState.answered = true;
  diagState.selected = idx;
  const q = METHODS_DIAGNOSTIC[diagState.current];
  diagState.answers.push({ ch: q.ch, topic: q.topic, correct: idx === q.ans, selected: idx, qIndex: diagState.current });
  render();
}

function nextDiagnostic() {
  diagState.current++;
  diagState.answered = false;
  diagState.selected = null;
  render();
}

function resetDiagnostic() {
  diagState = { current: 0, answered: false, selected: null, answers: [], started: false };
  render();
}

function printCheatSheet() {
  window.print();
}

  html += `<div style="font-size:9.5pt;color:#64748b;margin-top:3px;">${types.length} question types · For each: how to identify it, what it's really asking, how to start, how to finish, common mistakes, and three worked examples.</div>`;

      t.mistakes.forEach(m => { html += `<li>${m}</li>`; });
      html += `</ul></div>`;

      html += `<div class="pdf-examples"><div class="pdf-examples-label">📝 WORKED EXAMPLES</div>`;

function buildCASPDFContent(chapter) {
  const c = METHODS_CHAPTERS.find(x => x.num === chapter);

  if (!skill) return '<div>No CAS skills for this chapter.</div>';
  let html = `<div class="pdf-root">`;
  html += `<div class="pdf-header" style="border-bottom-color:#8b5cf6;">`;
  html += `<div class="pdf-tag" style="color:#8b5cf6;">TI-NSPIRE CX CAS · METHODS UNIT 1</div>`;

  html += `<div class="pdf-sub">${skill.title}</div>`;
  html += `<div style="font-size:9.5pt;color:#64748b;margin-top:3px;">${skill.tasks.length} step-by-step CAS procedures with exact menu paths and keystrokes.</div>`;
  html += `</div>`;

  skill.tasks.forEach((task, i) => {
    html += `<div class="pdf-cas-task">`;
    html += `<div class="pdf-cas-tasktitle">⚙ ${i + 1}. ${task.name}</div>`;
    if (task.why) html += `<div class="pdf-cas-why">${task.why}</div>`;

    html += `</div>`;

  html += `<div class="pdf-footer">Jack VCE Study Master · v${APP_VERSION}</div>`;
  html += `</div>`;
  return html;

// ---------- EXPORT / PRINT chapter PDFs via browser-native print dialog ----------
// We open a new tab with the styled content, plus a sticky banner that explains how
// to save as PDF. The user can then use the browser's print dialog ("Save as PDF"
// or send to a real printer). This is much more reliable than html2pdf for text PDFs.
function openChapterPrintWindow(kind, chapter) {
  const c = METHODS_CHAPTERS.find(x => x.num === chapter);
  const title = kind === 'questions'
    ? `Methods Ch ${chapter} ${c.title} — Question Types`
    : `Methods Ch ${chapter} ${c.title} — CAS Skills`;
  const filename = kind === 'questions'
    ? `Methods-Ch${chapter}-${c.title.replace(/[^a-zA-Z0-9]/g, '')}-QuestionTypes`
    : `Methods-Ch${chapter}-${c.title.replace(/[^a-zA-Z0-9]/g, '')}-CAS-Skills`;
  const content = kind === 'questions' ? buildQuestionsPDFContent(chapter) : buildCASPDFContent(chapter);
  const isMac = /Mac|iPhone|iPad/i.test(navigator.platform);
  const shortcut = isMac ? '⌘ + P' : 'Ctrl + P';

  const w = window.open('', '_blank');
  if (!w) {
    alert('Pop-up blocked. Allow pop-ups for this page, then click PDF / Print again.');
    return;
  }

  const html = `<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>${filename}</title>
  <style>
    ${pdfPageStyles()}
    /* On-screen preview styling — looks like a paper page */
    @media screen {
      body { margin: 0; padding: 0; background: #e2e8f0; }
      .print-banner {
        position: sticky; top: 0; z-index: 100;
        background: linear-gradient(135deg, #fef3c7, #fde68a);
        border-bottom: 2px solid #f59e0b;
        padding: 14px 20px;
        display: flex; gap: 14px; align-items: center; flex-wrap: wrap;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        font-size: 14px; color: #78350f;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      }
      .print-banner strong { color: #92400e; }
      .print-banner .pb-msg { flex: 1; min-width: 240px; }
      .print-banner .pb-btn {
        padding: 8px 18px;
        background: #92400e; color: white;
        border: none; border-radius: 5px;
        font-weight: 700; font-size: 14px;
        cursor: pointer;
        box-shadow: 0 2px 4px rgba(146, 64, 14, 0.3);
      }
      .print-banner .pb-btn:hover { background: #78350f; }
      .pdf-root {
        max-width: 800px;
        margin: 24px auto;
        background: white;
        padding: 25mm 18mm;
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.15);
        min-height: 1100px;
      }
    }
    /* Actual print styling — full A4 width, banner hidden */
    @media print {
      .print-banner { display: none !important; }
      body { background: white; margin: 0; padding: 0; }
      .pdf-root { max-width: none; width: 100%; margin: 0; padding: 0; box-shadow: none; min-height: 0; }
    }
  </style>
</head>
<body>
  <div class="print-banner">
    <div class="pb-msg">📄 <strong>${title}</strong><br>
      <span style="font-size:13px;">Press <strong>${shortcut}</strong> (or click the button) → choose <strong>"Save as PDF"</strong> as the destination, or send to a printer.</span>
    </div>
    <button class="pb-btn" onclick="window.print()">🖨️ Print / Save as PDF</button>
  </div>
  ${content}
</body>
</html>`;

  w.document.open();
  w.document.write(html);
  w.document.close();
  w.focus();
}

function exportChapterPDF(kind, chapter) { openChapterPrintWindow(kind, chapter); }
function printChapterPDF(kind, chapter) { openChapterPrintWindow(kind, chapter); }

// ---------- PDF EXPORT (lazy-loads html2pdf.js from CDN) — used by cheat sheets ----------
let pdfExporting = false;

function exportCheatSheetPDF(targetId, filename) {
  if (pdfExporting) return;
  pdfExporting = true;
  const btn = event && event.currentTarget;
  const origLabel = btn ? btn.innerHTML : '';
  if (btn) btn.innerHTML = '⏳ Building PDF…';

  const finish = () => {
    pdfExporting = false;
    if (btn) btn.innerHTML = origLabel;
  };

  const doIt = () => {
    const el = document.getElementById(targetId);
    if (!el || typeof html2pdf === 'undefined') { finish(); alert('PDF export failed — try Print instead.'); return; }
    const opts = {
      margin: [0.3, 0.3, 0.3, 0.3],
      filename: filename,
      image: { type: 'jpeg', quality: 0.95 },
      html2canvas: { scale: 2, useCORS: true, backgroundColor: '#ffffff' },
      jsPDF: { unit: 'in', format: 'a4', orientation: 'portrait' },
      pagebreak: { mode: ['avoid-all', 'css', 'legacy'] }
    };
    html2pdf().set(opts).from(el).save().then(finish).catch(finish);
  };

  if (typeof html2pdf === 'undefined') {
    const script = document.createElement('script');
    script.src = 'https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js';
    script.onload = doIt;
    script.onerror = () => { finish(); alert('Could not load the PDF library (offline?). Try Print → Save as PDF instead.'); };
    document.head.appendChild(script);
  } else {
    doIt();
  }
}

    html += '<div class="card">';
    html += '<div class="section-title">🎯 Diagnostic Quiz</div>';
    html += `<p style="font-size:0.9rem;color:var(--text-muted);margin-bottom:0.75rem;">${total} questions spread evenly across Chapters 3, 4, 5 &amp; 6. After you finish you\'ll see a chapter-by-chapter score so you know exactly what to focus on tonight.</p>`;
    html += '<div class="mp-callout tip"><strong>How to use this:</strong> Don\'t Google the answers. Wrong answers are GOOD — they show you where the gaps are. The explanation appears after each question.</div>';
    html += '<button class="btn btn-primary" onclick="startDiagnostic()" style="background:linear-gradient(135deg,#6366f1,#8b5cf6);">Start the quiz →</button>';
    html += '</div>';
    return html;
  }

  // Quiz finished — chapter breakdown
  if (diagState.current >= total) {
    const byChapter = {};
    METHODS_CHAPTERS.forEach(c => { byChapter[c.num] = { total: 0, correct: 0, weak: [] }; });
    diagState.answers.forEach(a => {
      byChapter[a.ch].total++;
      if (a.correct) byChapter[a.ch].correct++;
      else byChapter[a.ch].weak.push(a.topic);
    });
    const overall = diagState.answers.filter(a => a.correct).length;
    const pct = Math.round((overall / total) * 100);

    html += '<div class="card">';
    html += '<div style="text-align:center;">';
    html += `<div style="font-size:3rem;">${pct >= 80 ? '🎉' : pct >= 60 ? '👍' : '💪'}</div>`;
    html += `<div style="font-size:2rem;font-weight:800;color:var(--accent);">${overall}/${total}</div>`;
    html += `<div style="color:var(--text-muted);margin-bottom:0.75rem;">${pct}% overall</div>`;
    html += '</div>';

    html += '<div class="section-title" style="margin-top:1rem;">Chapter breakdown</div>';
    METHODS_CHAPTERS.forEach(c => {
      const s = byChapter[c.num];
      const cp = s.total > 0 ? Math.round((s.correct / s.total) * 100) : 0;
      html += `<div style="margin-bottom:0.85rem;">`;
      html += `<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:0.4rem;">`;
      html += `<div style="font-weight:700;font-size:0.92rem;"><span class="mp-chapter-pill" style="background:${c.color}">Ch ${c.num}</span>${c.title}</div>`;
      html += `<div style="font-size:0.85rem;color:var(--text-muted);">${s.correct}/${s.total} · ${cp}%</div>`;
      html += `</div>`;
      html += `<div class="mp-diag-bar"><div class="mp-diag-bar-fill" style="width:${cp}%;background:${c.color};"></div></div>`;
      if (s.weak.length) {
        const uniq = [...new Set(s.weak)];
        html += `<div style="font-size:0.78rem;color:var(--danger-text);">⚠️ Review: ${uniq.join(' · ')}</div>`;
      }
      html += '</div>';
    });

    // Focus recommendation
    const sorted = METHODS_CHAPTERS.slice().sort((a, b) => {
      const ap = byChapter[a.num].correct / Math.max(byChapter[a.num].total, 1);
      const bp = byChapter[b.num].correct / Math.max(byChapter[b.num].total, 1);
      return ap - bp;
    });
    const weakest = sorted.slice(0, 2);
    html += '<div class="mp-callout warn" style="margin-top:0.75rem;"><strong>Tonight\'s focus:</strong> Spend most of your time on ';
    html += weakest.map(c => `<strong>Chapter ${c.num} (${c.title})</strong>`).join(' and ');
    html += '. Open the Chapters tab to drill into core concepts and worked traps.</div>';

    html += '<div style="display:flex;gap:0.5rem;flex-wrap:wrap;margin-top:0.75rem;">';
    html += `<button class="btn btn-primary" onclick="setMethodsChapter(${weakest[0].num}); setMethodsPrepView('chapters')" style="background:linear-gradient(135deg,#6366f1,#8b5cf6);">Study Chapter ${weakest[0].num} →</button>`;
    html += '<button class="btn btn-secondary" onclick="resetDiagnostic()">Retake quiz</button>';
    html += '<button class="btn btn-secondary" onclick="setMethodsPrepView(\'cheats\')">View cheat sheets</button>';
    html += '</div>';
    html += '</div>';
    return html;
  }

  // Active question
  const q = METHODS_DIAGNOSTIC[diagState.current];
  const ch = METHODS_CHAPTERS.find(c => c.num === q.ch);
  const progress = (diagState.current / total) * 100;

  html += '<div class="card">';
  html += '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:0.5rem;flex-wrap:wrap;gap:0.5rem;">';
  html += `<span style="font-weight:700;font-size:0.9rem;">Q ${diagState.current + 1} of ${total}</span>`;
  html += `<span class="mp-chapter-pill" style="background:${ch.color}">Ch ${q.ch} · ${q.topic}</span>`;
  html += '<button class="btn btn-secondary btn-sm" onclick="resetDiagnostic()">Exit</button>';
  html += '</div>';
  html += `<div class="quiz-progress"><div class="quiz-progress-fill" style="width:${progress}%;background:linear-gradient(135deg,#6366f1,#8b5cf6);"></div></div>`;

  html += `<div class="quiz-question" style="margin-top:0.6rem;">${q.q}</div>`;
  html += '<div class="quiz-options">';
  q.opts.forEach((opt, i) => {
    let cls = 'quiz-option';
    if (diagState.answered) {
      if (i === q.ans) cls += ' correct';
      else if (i === diagState.selected && i !== q.ans) cls += ' incorrect';
      else cls += ' dimmed';
    }
    const pe = diagState.answered ? 'pointer-events:none;' : '';
    html += `<button class="${cls}" style="${pe}" onclick="answerDiagnostic(${i})">${opt}</button>`;
  });
  html += '</div>';

  if (diagState.answered) {
    const ok = diagState.selected === q.ans;
    html += `<div class="quiz-explanation" style="background:${ok ? 'var(--success-bg)' : 'var(--danger-bg)'};border-color:${ok ? 'var(--success-border)' : 'var(--danger-border)'};">`;
    html += `<strong>${ok ? '✅ Correct.' : '❌ Not quite.'}</strong> ${q.explain}</div>`;
    html += '<div style="text-align:center;margin-top:0.75rem;">';
    html += `<button class="btn btn-primary" onclick="nextDiagnostic()" style="background:linear-gradient(135deg,#6366f1,#8b5cf6);">${diagState.current + 1 >= total ? 'See results →' : 'Next question →'}</button>`;
    html += '</div>';
  }
  html += '</div>';
  return html;
}

function renderMPChapters() {
  let html = '';

  // Chapter selector
  html += '<div class="mp-tabs">';
  METHODS_CHAPTERS.forEach(c => {
    const active = c.num === methodsPrepActiveChapter;
    html += `<button class="mp-tab ${active ? 'active' : ''}" onclick="setMethodsChapter(${c.num})" style="${active ? `background:${c.color};color:white;border-color:transparent;` : ''}">Ch ${c.num}</button>`;
  });
  html += '</div>';

  const c = METHODS_CHAPTERS.find(x => x.num === methodsPrepActiveChapter);
  if (!c) return html;

  // Mode toggle: Walkthrough vs See all
  html += '<div style="display:flex;gap:0.4rem;margin-bottom:0.6rem;flex-wrap:wrap;">';
  html += `<button class="btn btn-sm ${methodsPrepChaptersMode === 'walkthrough' ? 'btn-primary' : 'btn-secondary'}" onclick="setMethodsChaptersMode('walkthrough')" style="${methodsPrepChaptersMode === 'walkthrough' ? `background:${c.color};` : ''}">🚶 Walkthrough</button>`;
  html += `<button class="btn btn-sm ${methodsPrepChaptersMode === 'list' ? 'btn-primary' : 'btn-secondary'}" onclick="setMethodsChaptersMode('list')" style="${methodsPrepChaptersMode === 'list' ? `background:${c.color};` : ''}">📋 See all</button>`;

    html += renderMPChaptersWalkthrough(c);
  } else {
    html += renderMPChaptersList(c);

function renderMPChaptersWalkthrough(c) {
  let html = '';
  const step = methodsPrepStepByChapter[c.num] || 0;
  const total = c.concepts.length;
  const concept = c.concepts[step];

  // Step 0: chapter overview card
  if (step === -1) { /* unused, kept for symmetry */ }

  // Chapter intro card (always shown above the walker)
  html += `<div class="card" style="border-left:4px solid ${c.color};">`;
  html += `<div style="display:flex;gap:0.6rem;align-items:flex-start;flex-wrap:wrap;">`;
  html += `<div style="font-size:1.8rem;">${c.icon}</div>`;
  html += `<div style="flex:1;min-width:200px;">`;
  html += `<div style="font-size:0.7rem;font-weight:700;color:${c.color};letter-spacing:0.1em;">CHAPTER ${c.num}</div>`;
  html += `<div style="font-size:1.2rem;font-weight:800;margin-bottom:0.3rem;">${c.title}</div>`;
  html += `<div style="font-size:0.85rem;color:var(--text-muted);">${c.summary}</div>`;
  html += `</div></div></div>`;

  // Step indicator + progress
  html += `<div style="margin-top:0.6rem;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:0.4rem;">`;
  html += `<div style="font-weight:700;font-size:0.85rem;color:${c.color};">Step ${step + 1} of ${total}</div>`;
  html += `<div style="font-size:0.78rem;color:var(--text-muted);">${concept.name}</div>`;
  html += `</div>`;
  // Progress bar
  const pct = ((step + 1) / total) * 100;
  html += `<div class="mp-diag-bar" style="margin-top:0.3rem;"><div class="mp-diag-bar-fill" style="width:${pct}%;background:${c.color};"></div></div>`;

  // Concept card
  html += `<div class="card" style="border-left:4px solid ${c.color};">`;
  html += `<div style="font-weight:800;font-size:1.05rem;margin-bottom:0.4rem;color:var(--text);">${concept.name}</div>`;
  if (concept.body) html += `<div style="font-size:0.9rem;line-height:1.6;color:var(--text-muted);margin-bottom:0.5rem;">${concept.body}</div>`;

  // Interactive widget (if applicable)
  const widgetId = CONCEPT_WIDGETS[concept.name];
  if (widgetId) {
    html += renderWidget(widgetId);
  }

  // Formulas
  if (concept.formulas && concept.formulas.length) {
    html += '<div style="font-weight:700;font-size:0.82rem;margin-top:0.5rem;color:var(--text);">📐 Key formulas</div>';
    html += '<div class="mp-formula-block">' + concept.formulas.map(f => escapeHtml(f)).join('\n') + '</div>';
  }
  // Traps
  if (concept.traps && concept.traps.length) {
    html += '<div class="mp-callout warn"><strong>⚠️ Watch out:</strong><ul style="margin:0.3rem 0 0 1.2rem;">';
    concept.traps.forEach(t => { html += `<li>${t}</li>`; });
    html += '</ul></div>';
  }
  // Plain-English explainer
  const explainer = METHODS_EXPLAINERS[concept.name];
  if (explainer) {
    const exKey = `ex-walkthrough-${c.num}-${step}`;
    const exOpen = methodsPrepExpandedExplainers[exKey];
    html += `<button class="btn btn-sm" style="margin-top:0.5rem;background:rgba(99,102,241,0.12);border:1px solid #6366f1;color:#6366f1;font-weight:600;" onclick="toggleMethodsExplainer('${exKey}')">${exOpen ? '▲ Hide deeper explanation' : 'ℹ️ Explain this in plain English'}</button>`;
    if (exOpen) {
      html += `<div class="mp-callout tip" style="margin-top:0.5rem;background:rgba(99,102,241,0.08);border-color:#6366f1;color:var(--text);"><div style="font-weight:700;font-size:0.85rem;margin-bottom:0.3rem;color:#6366f1;">💬 In plain English</div><div style="font-size:0.85rem;line-height:1.6;">${explainer}</div></div>`;
    }
  }
  html += `</div>`;

  // Navigation
  html += `<div style="display:flex;justify-content:space-between;gap:0.4rem;margin-top:0.5rem;">`;
  html += `<button class="btn btn-secondary btn-sm" ${step === 0 ? 'disabled' : ''} onclick="setMethodsStep(${step - 1})">◀ Previous</button>`;
  // Mini step dots
  html += `<div style="display:flex;gap:4px;align-items:center;flex-wrap:wrap;justify-content:center;">`;
  for (let i = 0; i < total; i++) {
    const isCur = i === step;
    html += `<button onclick="setMethodsStep(${i})" title="${c.concepts[i].name}" aria-label="${c.concepts[i].name}" style="width:${isCur ? 18 : 8}px;height:8px;border-radius:4px;border:none;cursor:pointer;background:${isCur ? c.color : 'var(--border)'};transition:width 0.2s;"></button>`;
  }
  html += `</div>`;
  if (step < total - 1) {
    html += `<button class="btn btn-primary btn-sm" onclick="setMethodsStep(${step + 1})" style="background:${c.color};">Next ▶</button>`;
  } else {
    html += `<button class="btn btn-primary btn-sm" onclick="setMethodsPrepView('revision')" style="background:linear-gradient(135deg,#6366f1,#8b5cf6);">📝 Try revision</button>`;
  }
  html += `</div>`;

  // Quick-jump objectives at the end of the chapter
  if (step === 0) {
    html += '<div class="card" style="margin-top:0.5rem;">';
    html += '<div style="font-weight:700;font-size:0.88rem;margin-bottom:0.4rem;">📋 By the end of this chapter you\'ll be able to:</div>';
    html += '<ul style="margin:0;padding-left:1.2rem;font-size:0.83rem;line-height:1.65;color:var(--text-muted);">';
    c.objectives.forEach(o => { html += `<li>${o}</li>`; });
    html += '</ul></div>';
  }
  return html;
}

        if (exOpen) html += `<div class="mp-callout tip" style="margin-top:0.5rem;background:rgba(99,102,241,0.08);border-color:#6366f1;color:var(--text);"><div style="font-weight:700;font-size:0.85rem;margin-bottom:0.3rem;color:#6366f1;">💬 In plain English</div><div style="font-size:0.85rem;line-height:1.6;">${explainer}</div></div>`;

  html += '</div>';
  return html;
}

function expandAllConcepts(chNum) {
  const c = METHODS_CHAPTERS.find(x => x.num === chNum);

  c.concepts.forEach((_, i) => { methodsPrepExpandedConcepts[`${chNum}-${i}`] = true; });

}
function collapseAllConcepts(chNum) {
  const c = METHODS_CHAPTERS.find(x => x.num === chNum);
  if (!c) return;
  c.concepts.forEach((_, i) => { methodsPrepExpandedConcepts[`${chNum}-${i}`] = false; });
  render();
}

function escapeHtml(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

    q: 'Express y = x² − 6x + 11 in turning-point form and state the turning point.',

  { ch: 3, num: 4, type: 'tf', marks: 2, concept: 'Discriminant',

  { ch: 3, num: 5, type: 'ta', marks: 1, concept: 'CAS factor',

  { ch: 3, num: 6, type: 'ta', marks: 2, concept: 'CAS complete-the-square',

  { ch: 3, num: 7, type: 'ta', marks: 3, concept: 'Tangent line / discriminant',

  { ch: 3, num: 8, type: 'ta', marks: 3, concept: 'Simultaneous linear & quadratic',

  { ch: 3, num: 11, type: 'mc', marks: 1, concept: 'Discriminant inequality',

  { ch: 3, num: 12, type: 'mc', marks: 1, concept: 'Quadratic inequality',

  { ch: 3, num: 13, type: 'ext', marks: 5, concept: 'Projectile modelling',
    q: 'A diver\'s height above water t seconds after leaving the board is given by h(t) = −5t² + 4t + 3 metres.\n(a) Find the maximum height reached and when it occurs.\n(b) Find, in exact form, the time when the diver hits the water.',
    working: ['(a) TP at t = −b/(2a) = −4/(−10) = 0.4 s', '    h(0.4) = −5(0.16) + 4(0.4) + 3 = −0.8 + 1.6 + 3 = 3.8 m', '    ∴ max height = 3.8 m at t = 0.4 s', '(b) Hits water when h = 0:  −5t² + 4t + 3 = 0  ⇒  5t² − 4t − 3 = 0', '    t = [4 ± √(16 + 60)] / 10 = (4 ± √76) / 10 = (4 ± 2√19) / 10 = (2 ± √19) / 5', '    Take positive root:  t = (2 + √19)/5 s ≈ 1.27 s'],
    answer: 'Max height 3.8 m at t = 0.4 s; hits water at t = (2 + √19)/5 s ≈ 1.27 s',

  { ch: 3, num: 14, type: 'ext', marks: 5, concept: 'Optimisation',

    working: ['(a) Length along river = 80 − 2x.', '    A = x(80 − 2x) = 80x − 2x²', '(b) TP at x = −80/(2 × −2) = 20.', '    Width x = 20 m, length 80 − 40 = 40 m.', '(c) A_max = 20 × 40 = 800 m²'],
    answer: 'A = 80x − 2x²; width 20 m × length 40 m; max area 800 m²',

  // ============ CHAPTER 4 — GALLERY OF GRAPHS ============

    answer: 'Centre (2, −3), radius 5',

  { ch: 4, num: 5, type: 'ta', marks: 1, concept: 'CAS domain',

    answer: '(x − 3)² + (y + 2)² = 25',

  { ch: 4, num: 8, type: 'ta', marks: 3, concept: 'Finding equation from graph',

  { ch: 4, num: 13, type: 'ext', marks: 5, concept: 'Square root from features',

  { ch: 4, num: 14, type: 'ext', marks: 5, concept: 'Circle in context',

  // ============ CHAPTER 5 — FUNCTIONS, RELATIONS & TRANSFORMATIONS ============

  { ch: 5, num: 5, type: 'ta', marks: 3, concept: 'Piecewise functions',

    working: ['(a) 0 < 1, so use the first piece:  f(0) = 2(0) + 1 = 1', '(b) x = 1 satisfies x ≥ 1, so use the SECOND piece:  f(1) = 3 − 1² = 2', '(c) Try each piece separately:', '    First piece (x < 1):  2x + 1 = −1  ⇒  x = −1  ✓ (since −1 < 1)', '    Second piece (x ≥ 1):  3 − x² = −1  ⇒  x² = 4  ⇒  x = 2 (taking the value ≥ 1)', '    ∴ x = −1 or x = 2'],

  { ch: 5, num: 6, type: 'ta', marks: 2, concept: 'Inverse function',

    answer: 'f⁻¹(x) = 3x − 2',

  { ch: 5, num: 7, type: 'ta', marks: 3, concept: 'Set & interval notation',

  { ch: 5, num: 8, type: 'ta', marks: 3, concept: 'Restricting domain for inverse',

// State + handlers for Revision Workout
let revisionChapter = 3;
let revisionFilter = 'all'; // 'all' | 'tf' | 'ta' | 'mc' | 'ext'
let revisionRevealed = {};

function setRevisionChapter(n) { revisionChapter = n; render(); }
function setRevisionFilter(f) { revisionFilter = f; render(); }
function toggleRevisionReveal(key) {
  revisionRevealed[key] = !revisionRevealed[key];
  render();
}
function revealAllRevision() {
  METHODS_REVISION.filter(q => q.ch === revisionChapter).forEach(q => {
    revisionRevealed[`${q.ch}-${q.num}`] = true;
  });
  render();
}
function hideAllRevision() {
  METHODS_REVISION.filter(q => q.ch === revisionChapter).forEach(q => {
    revisionRevealed[`${q.ch}-${q.num}`] = false;
  });
  render();
}

// State + handlers for Practice Quiz
let practiceState = { chapter: 'all', started: false, current: 0, answered: false, selected: null, answers: [], questions: [] };

function startPracticeQuiz(chapter) {
  const pool = chapter === 'all'
    ? METHODS_PRACTICE_MC.slice()
    : METHODS_PRACTICE_MC.filter(q => q.ch === chapter);
  // Shuffle
  for (let i = pool.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [pool[i], pool[j]] = [pool[j], pool[i]];
  }
  practiceState = { chapter, started: true, current: 0, answered: false, selected: null, answers: [], questions: pool };
  render();
}
function answerPractice(idx) {
  if (practiceState.answered) return;
  practiceState.answered = true;
  practiceState.selected = idx;
  const q = practiceState.questions[practiceState.current];
  practiceState.answers.push({ ch: q.ch, correct: idx === q.ans });
  render();
}
function nextPractice() {
  practiceState.current++;
  practiceState.answered = false;
  practiceState.selected = null;
  render();
}
function resetPractice() {
  practiceState = { chapter: 'all', started: false, current: 0, answered: false, selected: null, answers: [], questions: [] };
  render();
}

  // Chapter selector
  html += '<div class="mp-tabs">';
  METHODS_CHAPTERS.forEach(c => {
    const active = c.num === revisionChapter;
    html += `<button class="mp-tab ${active ? 'active' : ''}" onclick="setRevisionChapter(${c.num})" style="${active ? `background:${c.color};color:white;border-color:transparent;` : ''}">Ch ${c.num}</button>`;
  });
  html += '</div>';

  // Type filter
  const filters = [
    { id: 'all', label: 'All types' },
    { id: 'tf', label: 'Tech-free' },
    { id: 'ta', label: 'Tech-active (CAS)' },
    { id: 'mc', label: 'Multiple choice' },
    { id: 'ext', label: 'Extended response' }
  ];
  html += '<div class="mp-tabs" style="margin-top:0;">';
  filters.forEach(f => {
    const active = f.id === revisionFilter;
    html += `<button class="mp-tab ${active ? 'active' : ''}" onclick="setRevisionFilter('${f.id}')">${f.label}</button>`;
  });
  html += '</div>';

  const c = METHODS_CHAPTERS.find(x => x.num === revisionChapter);
  const questions = METHODS_REVISION.filter(q => q.ch === revisionChapter && (revisionFilter === 'all' || q.type === revisionFilter));

  html += `<div class="card" style="border-left:4px solid ${c.color};">`;
  html += `<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:0.4rem;">`;
  html += `<div><div style="font-weight:800;font-size:1.05rem;">Chapter ${c.num} · ${c.title}</div><div style="font-size:0.82rem;color:var(--text-muted);">${questions.length} question${questions.length !== 1 ? 's' : ''} shown</div></div>`;
  html += `<div style="display:flex;gap:0.3rem;flex-wrap:wrap;"><button class="btn btn-secondary btn-sm" onclick="revealAllRevision()">Reveal all</button><button class="btn btn-secondary btn-sm" onclick="hideAllRevision()">Hide all</button></div>`;
  html += `</div></div>`;

  if (questions.length === 0) {
    html += '<div class="card"><em>No questions of this type in this chapter.</em></div>';
    return html;
  }

  questions.forEach(q => {
    const key = `${q.ch}-${q.num}`;
    const revealed = revisionRevealed[key];
    const typeLabel = { tf: 'Tech-free', ta: 'Tech-active', mc: 'Multiple choice', ext: 'Extended response' }[q.type] || q.type;
    const typeColor = { tf: '#10b981', ta: '#8b5cf6', mc: '#f59e0b', ext: '#dc2626' }[q.type] || '#6366f1';

    html += `<div class="mp-concept" style="border-left:3px solid ${c.color};">`;
    html += '<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:0.4rem;margin-bottom:0.4rem;">';
    html += `<div style="font-weight:800;">Q${q.num}.  <span style="font-weight:600;color:var(--text-muted);font-size:0.8rem;margin-left:0.3rem;">${typeLabel}</span>`;
    if (q.marks) html += ` <span style="font-weight:600;font-size:0.78rem;color:var(--text-muted);">· ${q.marks} mark${q.marks !== 1 ? 's' : ''}</span>`;
    html += `</div>`;
    html += `<span class="mp-chapter-pill" style="background:${typeColor}">${q.concept}</span>`;
    html += '</div>';

    // Question body
    html += `<div style="font-size:0.92rem;line-height:1.6;white-space:pre-wrap;">${escapeHtml(q.q)}</div>`;

    // MC options (if any)
    if (q.type === 'mc' && q.opts) {
      html += '<div style="margin-top:0.5rem;display:grid;grid-template-columns:1fr 1fr;gap:0.3rem;">';
      ['A', 'B', 'C', 'D'].forEach((letter, i) => {
        const isCorrect = revealed && i === q.ans;
        html += `<div style="font-size:0.85rem;padding:0.35rem 0.55rem;background:${isCorrect ? 'var(--success-bg)' : 'var(--surface)'};border:1px solid ${isCorrect ? 'var(--success-border)' : 'var(--border)'};border-radius:6px;"><strong>${letter}.</strong> ${escapeHtml(q.opts[i])}</div>`;
      });
      html += '</div>';
    }

    // Reveal button
    html += `<button class="btn ${revealed ? 'btn-secondary' : 'btn-primary'} btn-sm" style="margin-top:0.6rem;${!revealed ? `background:linear-gradient(135deg,#6366f1,#8b5cf6);` : ''}" onclick="toggleRevisionReveal('${key}')">${revealed ? '▲ Hide solution' : '▼ Reveal solution'}</button>`;

    // Solution body
    if (revealed) {
      html += '<div style="margin-top:0.6rem;padding:0.6rem 0.8rem;background:var(--bg-subtle);border-radius:8px;border-left:3px solid var(--success);">';
      html += '<div style="font-weight:700;font-size:0.85rem;margin-bottom:0.3rem;color:var(--success);">✏️ Working</div>';
      html += '<div class="mp-formula-block" style="border-left:none;margin:0;">' + q.working.map(w => escapeHtml(w)).join('\n') + '</div>';
      html += `<div style="font-weight:700;font-size:0.85rem;margin-top:0.5rem;color:var(--success);">✓ Answer</div>`;
      html += `<div style="font-weight:700;font-size:0.95rem;padding:0.3rem 0.6rem;background:var(--success-bg);border-radius:6px;display:inline-block;margin-top:0.2rem;">${escapeHtml(q.answer)}</div>`;
      if (q.hint) html += `<div class="mp-callout tip" style="margin-top:0.5rem;"><strong>💡 Learn:</strong> ${escapeHtml(q.hint)}</div>`;
      html += '</div>';
    }
    html += '</div>';
  });

  return html;
}

// ---------- PRACTICE QUIZ RENDER ----------
function renderMPPractice() {
  let html = '';

  // Pre-quiz screen
  if (!practiceState.started) {
    html += '<div class="card">';
    html += '<div class="section-title">🏁 Practice Quiz</div>';
    html += `<p style="font-size:0.9rem;color:var(--text-muted);margin-bottom:0.75rem;">Multiple-choice quiz with score tracking and a chapter breakdown at the end. ${METHODS_PRACTICE_MC.length} questions available across all chapters.</p>`;
    html += '<div class="mp-callout tip">Choose a chapter to focus on, or pick "All chapters" for a mixed quiz. Questions are shuffled each time.</div>';

    html += '<div class="section-title" style="margin-top:0.75rem;">Choose your scope</div>';
    html += '<div style="display:grid;grid-template-columns:repeat(auto-fit, minmax(160px, 1fr));gap:0.5rem;">';

    METHODS_CHAPTERS.forEach(c => {
      const n = METHODS_PRACTICE_MC.filter(q => q.ch === c.num).length;
      html += `<button class="mp-chapter-card" style="border-left-color:${c.color}" onclick="startPracticeQuiz(${c.num})">`;
      html += `<div class="mp-chapter-num" style="color:${c.color}">CHAPTER ${c.num}</div>`;
      html += `<div style="font-weight:800;font-size:0.95rem;">${c.title}</div>`;
      html += `<div style="font-size:0.78rem;color:var(--text-muted);margin-top:0.25rem;">${n} questions</div>`;
      html += '</button>';
    });
    html += `<button class="mp-chapter-card" style="border-left-color:#8b5cf6" onclick="startPracticeQuiz('all')">`;
    html += `<div class="mp-chapter-num" style="color:#8b5cf6">🎯 ALL</div>`;
    html += `<div style="font-weight:800;font-size:0.95rem;">All chapters mixed</div>`;
    html += `<div style="font-size:0.78rem;color:var(--text-muted);margin-top:0.25rem;">${METHODS_PRACTICE_MC.length} questions</div>`;
    html += '</button>';

    html += '</div></div>';
    return html;
  }

  const total = practiceState.questions.length;

  // Finished screen
  if (practiceState.current >= total) {
    const byChapter = {};
    METHODS_CHAPTERS.forEach(c => { byChapter[c.num] = { total: 0, correct: 0 }; });
    practiceState.answers.forEach(a => {
      byChapter[a.ch].total++;
      if (a.correct) byChapter[a.ch].correct++;
    });
    const overall = practiceState.answers.filter(a => a.correct).length;
    const pct = Math.round((overall / total) * 100);

    html += '<div class="card">';
    html += '<div style="text-align:center;">';
    html += `<div style="font-size:3rem;">${pct >= 80 ? '🎉' : pct >= 60 ? '👍' : '💪'}</div>`;
    html += `<div style="font-size:2rem;font-weight:800;color:var(--accent);">${overall}/${total}</div>`;
    html += `<div style="color:var(--text-muted);margin-bottom:0.75rem;">${pct}% overall</div>`;
    html += '</div>';

    html += '<div class="section-title" style="margin-top:1rem;">Chapter breakdown</div>';
    METHODS_CHAPTERS.forEach(c => {
      const s = byChapter[c.num];
      if (s.total === 0) return;
      const cp = Math.round((s.correct / s.total) * 100);
      html += `<div style="margin-bottom:0.7rem;">`;
      html += `<div style="display:flex;justify-content:space-between;align-items:center;gap:0.4rem;flex-wrap:wrap;">`;
      html += `<div style="font-weight:700;font-size:0.92rem;"><span class="mp-chapter-pill" style="background:${c.color}">Ch ${c.num}</span>${c.title}</div>`;
      html += `<div style="font-size:0.85rem;color:var(--text-muted);">${s.correct}/${s.total} · ${cp}%</div>`;
      html += `</div>`;
      html += `<div class="mp-diag-bar"><div class="mp-diag-bar-fill" style="width:${cp}%;background:${c.color};"></div></div>`;
      html += '</div>';
    });

    html += '<div style="display:flex;gap:0.5rem;flex-wrap:wrap;margin-top:0.75rem;">';
    html += '<button class="btn btn-primary" onclick="resetPractice()" style="background:linear-gradient(135deg,#6366f1,#8b5cf6);">New quiz</button>';
    html += '<button class="btn btn-secondary" onclick="setMethodsPrepView(\'revision\')">📝 Revision Workout</button>';
    html += '</div>';
    html += '</div>';
    return html;
  }

  // Active question
  const q = practiceState.questions[practiceState.current];
  const ch = METHODS_CHAPTERS.find(c => c.num === q.ch);
  const progress = (practiceState.current / total) * 100;

  html += '<div class="card">';
  html += '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:0.5rem;flex-wrap:wrap;gap:0.4rem;">';
  html += `<span style="font-weight:700;font-size:0.9rem;">Q ${practiceState.current + 1} of ${total}</span>`;
  html += `<span class="mp-chapter-pill" style="background:${ch.color}">Ch ${q.ch}</span>`;
  html += '<button class="btn btn-secondary btn-sm" onclick="resetPractice()">Exit</button>';
  html += '</div>';
  html += `<div class="quiz-progress"><div class="quiz-progress-fill" style="width:${progress}%;background:linear-gradient(135deg,#6366f1,#8b5cf6);"></div></div>`;

  html += `<div class="quiz-question" style="margin-top:0.6rem;">${escapeHtml(q.q)}</div>`;
  html += '<div class="quiz-options">';
  q.opts.forEach((opt, i) => {
    let cls = 'quiz-option';
    if (practiceState.answered) {
      if (i === q.ans) cls += ' correct';
      else if (i === practiceState.selected && i !== q.ans) cls += ' incorrect';
      else cls += ' dimmed';
    }
    const pe = practiceState.answered ? 'pointer-events:none;' : '';
    html += `<button class="${cls}" style="${pe}" onclick="answerPractice(${i})">${escapeHtml(opt)}</button>`;
  });
  html += '</div>';

  if (practiceState.answered) {
    const ok = practiceState.selected === q.ans;
    html += `<div class="quiz-explanation" style="background:${ok ? 'var(--success-bg)' : 'var(--danger-bg)'};border-color:${ok ? 'var(--success-border)' : 'var(--danger-border)'};">`;
    html += `<strong>${ok ? '✅ Correct.' : '❌ Not quite.'}</strong> ${escapeHtml(q.explain)}</div>`;
    html += '<div style="text-align:center;margin-top:0.75rem;">';
    html += `<button class="btn btn-primary" onclick="nextPractice()" style="background:linear-gradient(135deg,#6366f1,#8b5cf6);">${practiceState.current + 1 >= total ? 'See results →' : 'Next question →'}</button>`;
    html += '</div>';
  }
  html += '</div>';
  return html;
}

    html += `<div><span class="mp-chapter-pill" style="background:${accent};margin-right:0.4rem;">DAY ${d.day} · ${chapterTag}</span><span style="font-weight:700;${done ? 'text-decoration:line-through;' : ''}">${d.title}</span></div>`;
    html += `<span style="font-size:0.8rem;color:var(--text-muted);">${open ? '▲' : '▼'}</span>`;
    html += `</div>`;
    html += `</div>`;
    // Time + sections (always visible)
    html += `<div style="font-size:0.78rem;color:var(--text-muted);margin-top:0.3rem;padding-left:30px;"><strong>⏱ ${d.estTime}</strong> · ${d.sections.join(' · ')}</div>`;

    if (open) {
      html += `<div class="mp-concept-body">`;
      // Summary
      html += `<div style="font-size:0.88rem;line-height:1.55;color:var(--text);margin-bottom:0.6rem;">${d.summary}</div>`;

      // Videos
      html += `<div style="margin:0.5rem 0;padding:0.6rem 0.75rem;background:rgba(220,38,38,0.06);border-left:3px solid #dc2626;border-radius:6px;">`;
      html += `<div style="font-weight:700;font-size:0.82rem;color:#dc2626;margin-bottom:0.35rem;">📺 Eddie Woo / Wootube videos</div>`;
      d.videos.forEach(v => {
        const url = v.url ? v.url : wooSearch(v.q);
        html += `<div style="font-size:0.85rem;margin:0.18rem 0;"><a href="${url}" target="_blank" rel="noopener" style="color:#dc2626;text-decoration:none;font-weight:600;">▶ ${v.title}</a> <span style="color:var(--text-muted);font-size:0.78rem;">${v.q ? '(opens YouTube search)' : ''}</span></div>`;
      });
      html += `<div style="font-size:0.75rem;color:var(--text-muted);margin-top:0.35rem;font-style:italic;">Each link opens a search on Eddie Woo\'s channel for the topic — pick the most relevant videos that match your textbook content.</div>`;
      html += `</div>`;

      // Check questions
      html += `<div style="margin-top:0.5rem;">`;
      html += `<div style="font-weight:700;font-size:0.82rem;color:var(--text);margin-bottom:0.4rem;">✅ Check your knowledge (tap to reveal answers)</div>`;
      d.questions.forEach((q, i) => {
        const key = `plan-${d.day}-q${i}`;
        const qOpen = studyPlanExpanded[key];
        html += `<div style="background:var(--bg-subtle);border:1px solid var(--border);border-radius:6px;padding:0.55rem 0.7rem;margin-bottom:0.35rem;">`;
        html += `<div style="font-size:0.85rem;line-height:1.5;"><strong>Q${i + 1}.</strong> ${q.q}</div>`;
        html += `<button class="btn btn-sm" style="margin-top:0.35rem;background:${qOpen ? 'transparent' : accent};color:${qOpen ? accent : 'white'};border:1px solid ${accent};font-size:0.75rem;padding:0.2rem 0.55rem;" onclick="toggleStudyPlanQuestion('${key}')">${qOpen ? '▲ Hide answer' : '▼ Reveal answer'}</button>`;
        if (qOpen) {
          html += `<div style="margin-top:0.35rem;padding:0.4rem 0.6rem;background:var(--success-bg);border-left:3px solid var(--success);border-radius:4px;font-size:0.85rem;line-height:1.5;"><strong style="color:var(--success);">A:</strong> ${q.a}</div>`;
        }
        html += `</div>`;
      });
      html += `</div>`;

      // Done button (large, in body)
      if (!done) {
        html += `<div style="margin-top:0.6rem;text-align:center;">`;
        html += `<button class="btn btn-primary btn-sm" onclick="toggleStudyPlanDone(${d.day})" style="background:${accent};">✓ Mark Day ${d.day} as done</button>`;
        html += `</div>`;
      }
      html += `</div>`;
    }
    html += `</div>`;
  });

  return html;
}

    if (open) {
      html += '<div class="mp-concept-body">';

      // Visual graphic (if applicable)
      const visualFn = CONCEPT_VISUALS[t.id];
      if (visualFn) {
        html += `<div style="margin:0.4rem 0 0.6rem;">${visualFn()}</div>`;

      html += `<div style="font-weight:700;font-size:0.82rem;color:#6366f1;margin-bottom:0.2rem;">🔍 Identify</div>`;

      html += `</div>`;

      // First steps
      html += `<div style="margin-top:0.4rem;padding:0.55rem 0.7rem;background:rgba(139,92,246,0.10);border-left:3px solid #8b5cf6;border-radius:6px;">`;
      html += `<div style="font-weight:700;font-size:0.82rem;color:#8b5cf6;margin-bottom:0.2rem;">🚀 First steps</div>`;
      html += `<ol style="margin:0.2rem 0 0 1.2rem;padding:0;font-size:0.85rem;line-height:1.55;">`;

      // Common mistakes
      if (t.mistakes && t.mistakes.length) {
        html += `<div style="margin-top:0.4rem;padding:0.55rem 0.7rem;background:rgba(220,38,38,0.10);border-left:3px solid #dc2626;border-radius:6px;">`;
        html += `<div style="font-weight:700;font-size:0.82rem;color:#dc2626;margin-bottom:0.2rem;">❌ Common mistakes</div>`;
        html += `<ul style="margin:0.2rem 0 0 1.2rem;padding:0;font-size:0.85rem;line-height:1.55;">`;
        t.mistakes.forEach(m => { html += `<li>${m}</li>`; });
        html += `</ul></div>`;
      }

      // Worked examples (3)
      if (t.examples && t.examples.length) {
        html += `<div style="margin-top:0.4rem;padding:0.55rem 0.7rem;background:var(--bg-subtle);border:1px solid var(--border);border-radius:6px;">`;
        html += `<div style="font-weight:700;font-size:0.82rem;color:var(--text);margin-bottom:0.4rem;">📝 Worked examples</div>`;
        t.examples.forEach((ex, i) => {
          html += `<div style="margin-bottom:${i < t.examples.length - 1 ? '0.55rem' : '0'};padding-left:0.5rem;border-left:2px solid var(--border);">`;
          html += `<div style="font-size:0.75rem;font-weight:700;color:var(--text-muted);letter-spacing:0.05em;margin-bottom:0.15rem;">EXAMPLE ${i + 1}</div>`;
          html += `<div style="font-size:0.85rem;line-height:1.5;"><strong>Q:</strong> ${ex.q}</div>`;
          if (ex.work) html += `<div style="font-size:0.8rem;line-height:1.5;color:var(--text-muted);margin-top:0.15rem;">${ex.work}</div>`;
          html += `<div style="font-size:0.85rem;line-height:1.5;margin-top:0.15rem;"><strong style="color:#10b981;">A:</strong> ${ex.a}</div>`;
          html += `</div>`;
        });
        html += `</div>`;
      } else if (t.example) {
        // Fallback for old-format entries
        html += `<div style="margin-top:0.4rem;padding:0.55rem 0.7rem;background:var(--bg-subtle);border:1px solid var(--border);border-radius:6px;">`;
        html += `<div style="font-weight:700;font-size:0.82rem;color:var(--text);margin-bottom:0.2rem;">📝 Worked example</div>`;
        html += `<div style="font-size:0.85rem;line-height:1.55;">${t.example}</div>`;
        html += `</div>`;
      }

      html += '</div>';
    }
    html += '</div>';
  });

  return html;
}

// CALCULATIONS
// ============================================================
function calcWeightedAvg(sub, state) {
  let totalWeight = 0;
  let weightedSum = 0;
  sub.assessments.forEach(a => {
    const data = state[a.id] || {};
    if (data.result !== undefined && data.result !== null && data.result !== '' && data.resultTotal) {
      const pct = (parseFloat(data.result) / parseFloat(data.resultTotal)) * 100;
      weightedSum += pct * a.weight;
      totalWeight += a.weight;
    }
  });
  if (totalWeight === 0) return null;
  return Math.round((weightedSum / totalWeight) * 10) / 10;
}

function saveNewAssessment(subjectId) {
  const name = document.getElementById('new-name').value.trim();
  if (!name) { alert('Please enter a name'); return; }
  const type = document.getElementById('new-type').value;
  const weight = parseFloat(document.getElementById('new-weight').value) || 0;
  const unit = document.getElementById('new-unit').value.trim() || '1';
  const area = document.getElementById('new-area').value.trim();
  const desc = document.getElementById('new-desc').value.trim();

  const subjects = getSubjects();
  const sub = subjects.find(s => s.id === subjectId);
  if (!sub) return;

  const newId = subjectId + '-custom-' + Date.now();
  sub.assessments.push({
    id: newId,
    name,
    type,
    weight,
    unit,
    area,
    description: desc
  });

  saveCustomSubjects(subjects);
  closeModal();
  render();
}

function editWeights(subjectId) {
  const subjects = getSubjects();
  const sub = subjects.find(s => s.id === subjectId);
  if (!sub) return;

  const modal = document.getElementById('modal');
  const content = document.getElementById('modal-content');

  let formHtml = '<h2>Edit Assessment Weights</h2>';
  formHtml += '<p style="font-size:0.85rem;color:var(--text-muted);margin-bottom:1rem;">Adjust the percentage weights to match your school\u2019s assessment outline. Weights should add up to 100%.</p>';

  sub.assessments.forEach((a, i) => {
    formHtml += `<div style="display:flex;align-items:center;gap:0.5rem;margin-bottom:0.5rem;">`;
    formHtml += `<input type="number" class="input-sm" id="weight-${i}" value="${a.weight}" min="0" max="100" style="width:65px">`;
    formHtml += `<span style="font-size:0.85rem;flex:1">${a.name}</span>`;
    formHtml += `<button class="btn btn-danger btn-sm" onclick="deleteAssessment('${subjectId}', ${i})" style="font-size:0.7rem;padding:0.2rem 0.4rem;">\u2715</button>`;
    formHtml += `</div>`;
  });

  formHtml += `<div id="weight-total" style="font-weight:600;margin-top:0.5rem;font-size:0.9rem;"></div>`;
  formHtml += `<div class="modal-actions">`;
  formHtml += `<button class="btn btn-secondary" onclick="closeModal()">Cancel</button>`;
  formHtml += `<button class="btn btn-primary" onclick="saveWeights('${subjectId}', ${sub.assessments.length})">Save Weights</button>`;
  formHtml += `</div>`;

  content.innerHTML = formHtml;
  modal.classList.add('open');

  // Update total display
  function updateTotal() {
    let total = 0;
    for (let i = 0; i < sub.assessments.length; i++) {
      const input = document.getElementById('weight-' + i);
      if (input) total += parseFloat(input.value) || 0;
    }
    const el = document.getElementById('weight-total');
    if (el) {
      el.textContent = `Total: ${total}%`;
      el.style.color = total === 100 ? 'var(--success)' : 'var(--danger)';
    }
  }
  updateTotal();
  for (let i = 0; i < sub.assessments.length; i++) {
    const input = document.getElementById('weight-' + i);
    if (input) input.addEventListener('input', updateTotal);
  }
}

function saveWeights(subjectId, count) {
  const subjects = getSubjects();
  const sub = subjects.find(s => s.id === subjectId);
  if (!sub) return;

  for (let i = 0; i < count; i++) {
    const input = document.getElementById('weight-' + i);
    if (input && sub.assessments[i]) {
      sub.assessments[i].weight = parseFloat(input.value) || 0;
    }
  }

  saveCustomSubjects(subjects);
  closeModal();
  render();
}

function deleteAssessment(subjectId, index) {
  if (!confirm('Delete this assessment?')) return;
  const subjects = getSubjects();
  const sub = subjects.find(s => s.id === subjectId);
  if (!sub) return;
  sub.assessments.splice(index, 1);
  saveCustomSubjects(subjects);
  closeModal();
  render();
}

  document.getElementById('modal').classList.remove('open');

// Export / Import
function exportData() {
  const state = loadState();
  const subjects = getCustomSubjects();
  const exportObj = {
    version: 1,
    exportedAt: new Date().toISOString(),
    assessmentData: state,
    customSubjects: subjects
  };
  const blob = new Blob([JSON.stringify(exportObj, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'jack-vce-data-' + new Date().toISOString().slice(0, 10) + '.json';
  a.click();
  URL.revokeObjectURL(url);
}

function importData(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const data = JSON.parse(e.target.result);
      if (data.assessmentData) {
        const current = loadState();
        const merged = { ...current, ...data.assessmentData };
        saveState(merged);
      }
      if (data.customSubjects) {
        saveCustomSubjects(data.customSubjects);
      }
      alert('Data imported successfully!');
      render();
    } catch (err) {
      alert('Error importing file: ' + err.message);
    }
  };
  reader.readAsText(file);
  event.target.value = '';
}

function resetSubjects() {
  if (!confirm('Reset all assessment customisations to defaults? Your dates, results, and notes will be kept.')) return;
  localStorage.removeItem(STORAGE_KEY + '_subjects');
  render();
}

function clearAllData() {
  if (!confirm('Delete ALL data including dates, results, and notes? This cannot be undone.')) return;
  if (!confirm('Are you sure? This will permanently erase everything.')) return;
  localStorage.removeItem(STORAGE_KEY);
  localStorage.removeItem(STORAGE_KEY + '_subjects');
  render();
}

// Konami code: Up Up Down Down Left Right Left Right B A
const KONAMI = ['ArrowUp','ArrowUp','ArrowDown','ArrowDown','ArrowLeft','ArrowRight','ArrowLeft','ArrowRight','b','a'];
let konamiIndex = 0;

// ---- SNAKE GAME ----
function launchSnakeGame() {
  const overlay = document.getElementById('gameOverlay');
  const container = document.getElementById('gameContainer');
  container.innerHTML = `
    <div class="game-header">
      <h2>🐍 Snake</h2>
      <div style="display:flex;align-items:center;gap:1rem;">
        <span id="snakeScore" style="font-weight:700;color:var(--accent);">Score: 0</span>
        <button class="game-close" onclick="closeGame()">&times;</button>
      </div>
    </div>
    <div class="game-body" style="display:flex;flex-direction:column;align-items:center;padding:1rem;">
      <canvas id="snakeCanvas" width="380" height="380" style="border:2px solid var(--border);border-radius:8px;background:#0f172a;max-width:100%;"></canvas>
      <div style="text-align:center;padding-top:0.75rem;font-size:0.8rem;color:var(--text-muted);">Arrow keys or swipe to move. Eat the food to grow!</div>
    </div>
  `;
  overlay.classList.add('open');

  const canvas = document.getElementById('snakeCanvas');
  const ctx = canvas.getContext('2d');
  const gridSize = 20;
  const tileCount = Math.floor(canvas.width / gridSize);

  let snake = [{x: 10, y: 10}];
  let food = {x: 15, y: 15};
  let dx = 0, dy = 0;
  let score = 0;
  let gameRunning = true;

  function placeFood() {
    food.x = Math.floor(Math.random() * tileCount);
    food.y = Math.floor(Math.random() * tileCount);
    for (let seg of snake) {
      if (seg.x === food.x && seg.y === food.y) return placeFood();
    }
  }

  function draw() {
    ctx.fillStyle = '#0f172a';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    // Grid
    ctx.strokeStyle = '#1e293b';
    ctx.lineWidth = 0.5;
    for (let i = 0; i <= tileCount; i++) {
      ctx.beginPath(); ctx.moveTo(i * gridSize, 0); ctx.lineTo(i * gridSize, canvas.height); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, i * gridSize); ctx.lineTo(canvas.width, i * gridSize); ctx.stroke();
    }
    // Food
    ctx.fillStyle = '#fbbf24';
    ctx.shadowColor = '#fbbf24';
    ctx.shadowBlur = 10;
    ctx.beginPath();
    ctx.arc(food.x * gridSize + gridSize/2, food.y * gridSize + gridSize/2, gridSize/2 - 2, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
    // Snake
    snake.forEach((seg, i) => {
      const isHead = i === 0;
      ctx.fillStyle = isHead ? '#8b5cf6' : '#6366f1';
      ctx.shadowColor = isHead ? '#8b5cf6' : 'transparent';
      ctx.shadowBlur = isHead ? 8 : 0;
      const r = 4;
      const x = seg.x * gridSize + 1, y = seg.y * gridSize + 1, w = gridSize - 2, h = gridSize - 2;
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.lineTo(x + w - r, y); ctx.quadraticCurveTo(x + w, y, x + w, y + r);
      ctx.lineTo(x + w, y + h - r); ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
      ctx.lineTo(x + r, y + h); ctx.quadraticCurveTo(x, y + h, x, y + h - r);
      ctx.lineTo(x, y + r); ctx.quadraticCurveTo(x, y, x + r, y);
      ctx.closePath();
      ctx.fill();
      ctx.shadowBlur = 0;
    });
  }

  function update() {
    if (!gameRunning) return;
    if (dx === 0 && dy === 0) { draw(); return; }
    const head = { x: snake[0].x + dx, y: snake[0].y + dy };
    if (head.x < 0) head.x = tileCount - 1;
    if (head.x >= tileCount) head.x = 0;
    if (head.y < 0) head.y = tileCount - 1;
    if (head.y >= tileCount) head.y = 0;
    for (let seg of snake) {
      if (seg.x === head.x && seg.y === head.y) {
        gameRunning = false;
        clearInterval(window._snakeInterval);
        ctx.fillStyle = 'rgba(0,0,0,0.7)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = 'white';
        ctx.font = 'bold 24px system-ui';
        ctx.textAlign = 'center';
        ctx.fillText('Game Over!', canvas.width/2, canvas.height/2 - 10);
        ctx.font = '16px system-ui';
        ctx.fillText('Score: ' + score, canvas.width/2, canvas.height/2 + 20);
        ctx.fillText('Press Space to restart', canvas.width/2, canvas.height/2 + 50);
        return;
      }
    }
    snake.unshift(head);
    if (head.x === food.x && head.y === food.y) {
      score++;
      document.getElementById('snakeScore').textContent = 'Score: ' + score;
      placeFood();
    } else {
      snake.pop();
    }
    draw();
  }

  function handleSnakeKey(e) {
    if (!document.getElementById('gameOverlay').classList.contains('open')) return;
    switch(e.key) {
      case 'ArrowUp': if (dy !== 1) { dx = 0; dy = -1; } e.preventDefault(); break;
      case 'ArrowDown': if (dy !== -1) { dx = 0; dy = 1; } e.preventDefault(); break;
      case 'ArrowLeft': if (dx !== 1) { dx = -1; dy = 0; } e.preventDefault(); break;
      case 'ArrowRight': if (dx !== -1) { dx = 1; dy = 0; } e.preventDefault(); break;
      case ' ':
        if (!gameRunning) {
          snake = [{x: 10, y: 10}]; dx = 0; dy = 0; score = 0; gameRunning = true;
          document.getElementById('snakeScore').textContent = 'Score: 0';
          placeFood();
          window._snakeInterval = setInterval(update, 120);
        }
        e.preventDefault();
        break;
    }
  }

  document.removeEventListener('keydown', window._snakeHandler);
  window._snakeHandler = handleSnakeKey;
  document.addEventListener('keydown', window._snakeHandler);

  // Touch/swipe controls for mobile
  let touchStartX = 0, touchStartY = 0;
  canvas.addEventListener('touchstart', function(e) {
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
    e.preventDefault();
    // Tap to restart when game over
    if (!gameRunning) {
      snake = [{x: 10, y: 10}]; dx = 0; dy = 0; score = 0; gameRunning = true;
      document.getElementById('snakeScore').textContent = 'Score: 0';
      placeFood();
      window._snakeInterval = setInterval(update, 120);
    }
  }, { passive: false });
  canvas.addEventListener('touchmove', function(e) { e.preventDefault(); }, { passive: false });
  canvas.addEventListener('touchend', function(e) {
    const diffX = e.changedTouches[0].clientX - touchStartX;
    const diffY = e.changedTouches[0].clientY - touchStartY;
    if (Math.abs(diffX) < 10 && Math.abs(diffY) < 10) return; // too small, ignore
    if (Math.abs(diffX) > Math.abs(diffY)) {
      if (diffX > 0 && dx !== -1) { dx = 1; dy = 0; }
      else if (diffX < 0 && dx !== 1) { dx = -1; dy = 0; }
    } else {
      if (diffY > 0 && dy !== -1) { dx = 0; dy = 1; }
      else if (diffY < 0 && dy !== 1) { dx = 0; dy = -1; }
    }
  });

  placeFood();
  draw();
  window._snakeInterval = setInterval(update, 120);
}

// ---- MEMORY MATCH GAME ----
function launchMemoryGame() {
  const overlay = document.getElementById('gameOverlay');
  const container = document.getElementById('gameContainer');
  const emojis = ['\u{1F4D0}','\u{1F9EC}','\u{1F4D6}','\u{1F4C8}','\u{1F4BC}','\u{1F3C0}','\u{1F52C}','\u{1F3AF}'];
  const cards = [...emojis, ...emojis];
  for (let i = cards.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [cards[i], cards[j]] = [cards[j], cards[i]];
  }
  let flipped = [];
  let matched = [];
  let moves = 0;
  let canFlip = true;

  function renderBoard() {
    let html = `<div class="game-header"><h2>\u{1F9E0} Memory Match</h2><div style="display:flex;align-items:center;gap:1rem;">`;
    html += `<span id="memoryMoves" style="font-weight:700;color:var(--accent);">Moves: ${moves}</span>`;
    html += `<span id="memoryPairs" style="font-weight:700;color:var(--success);">Pairs: ${matched.length/2}/8</span>`;
    html += `<button class="game-close" onclick="closeGame()">&times;</button></div></div>`;
    html += `<div class="game-body"><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:0.5rem;max-width:400px;margin:0 auto;">`;
    cards.forEach((emoji, i) => {
      const isFlipped = flipped.includes(i) || matched.includes(i);
      const isMatched = matched.includes(i);
      html += `<div class="memory-card ${isFlipped ? 'flipped' : ''} ${isMatched ? 'matched' : ''}" onclick="window._flipCard(${i})">`;
      html += isFlipped ? emoji : '?';
      html += `</div>`;
    });
    html += `</div><div style="text-align:center;margin-top:0.75rem;font-size:0.8rem;color:var(--text-muted);">Match all the subject emoji pairs!</div></div>`;
    container.innerHTML = html;
  }

  window._flipCard = function(index) {
    if (!canFlip) return;
    if (flipped.includes(index) || matched.includes(index)) return;
    flipped.push(index);
    renderBoard();
    if (flipped.length === 2) {
      moves++;
      canFlip = false;
      const [a, b] = flipped;
      if (cards[a] === cards[b]) {
        matched.push(a, b);
        flipped = [];
        canFlip = true;
        renderBoard();
        if (matched.length === cards.length) {
          setTimeout(() => {
            container.innerHTML = `<div class="game-header"><h2>\u{1F9E0} Memory Match</h2><button class="game-close" onclick="closeGame()">&times;</button></div>
              <div class="game-body" style="text-align:center;padding:2rem;">
                <div style="font-size:3rem;margin-bottom:0.5rem;">\u{1F389}</div>
                <div class="gradient-text" style="font-size:1.5rem;font-weight:800;">You Win!</div>
                <div style="margin:0.5rem 0;color:var(--text-muted);">Completed in ${moves} moves</div>
                <div style="display:flex;gap:0.5rem;justify-content:center;margin-top:1rem;">
                  <button class="btn btn-primary" onclick="launchMemoryGame()">Play Again</button>
                  <button class="btn btn-secondary" onclick="closeGame()">Close</button>
                </div>
              </div>`;
          }, 500);
        }
      } else {
        setTimeout(() => {
          flipped = [];
          canFlip = true;
          renderBoard();
        }, 800);
      }
    }
  };

  overlay.classList.add('open');
  renderBoard();
}
